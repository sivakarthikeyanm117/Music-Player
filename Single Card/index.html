<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingleCard</title>
    <style>
        button{
    padding: 10px;
    border: none;
    border-radius: 18px;
    background-image: url(./wp7.jpg);
    color: white;
    text-shadow: 4px 2px 8px black;
    font-weight: 600;
    box-shadow: 0px 5px 15px  rgba(0,0,0,0.2);
    box-shadow: 0px 0px 20px  rgba(0,0,0,0.5);
    /*box-shadow: 0 0 20px rgba(0, 123, 255, 0.5);*/
    margin: 5px;
    
}
p{
    background-image: url(./wp7.jpg) ;
    display: inline-block;
    color: white;
    text-shadow: 4px 2px 8px black;
    font-weight: 600;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    border-radius: 10px;
   
}
input{
    color: black;
    display: block;
    width: 80%;
    
}
#progress-bar{
    margin: 0 auto;
}
img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    margin-top: 30px;

}
.thumbnail{
    width: 150px;
    height: 150px;
    margin: 0 auto;
    margin-bottom: 40px;
}
.container{
    width: 280px;
    height: 320px;
    background-color: black;
    text-align: center;
    margin: 20px;
    
}
    </style>
</head>
<body>
    <div class="container">
        <div class="thumbnail">
            <img src="../maxresdefault.jpg" alt="">
        </div>
        <div class="controlspane">
            <button id="toggle-btn">Play</button>
        </div>
        <div class="pgbar">
            <audio src="../sounds/Aarzu_Cinematic_Asim_Azhar_Noor_Khan_Madhurxo_DJ_Sumit_Rajwanshi.mp3" id="audio-player" ></audio>
            <p id="timer"></p>
            <input type="range" name="" id="progress-bar">
        </div>
    </div>
    <script>
        var audioplayer = document.getElementById("audio-player");
/* var playBtn = document.getElementById("play-btn");
var pauseBtn = document.getElementById("pause-btn"); */
var timer = document.getElementById("timer");
var toggle = document.getElementById("toggle-btn");
var pgbar = document.getElementById("progress-bar");
console.log(audioplayer);

/* function startMusic(){
audioplayer.play();
}
function pauseMusic(){
    audioplayer.pause();
} */
function currentTime(){
    timer.textContent =  `Current: ${formatTime((audioplayer.currentTime))} / ${formatTime((audioplayer.duration))}`;
    pgbar.min = 0; 
    pgbar.max = audioplayer.duration;
    pgbar.value = audioplayer.currentTime;
    console.log(audioplayer.duration);
}
function formatTime(seconds){
    var minutes = Math.floor(seconds/60);
    var remainingSeconds = Math.floor(seconds%60);
    return `${String(minutes).padStart(2,"0")}:${String(remainingSeconds).padStart(2,"0")}`;
}
function toggleMusic(){
    if(audioplayer.paused === true){
        audioplayer.play()
        toggle.innerHTML = "Pause"
    }else{
        audioplayer.pause();
        toggle.innerHTML = "Play"
    }
}
function resetTime(){

        toggle.innerHTML = "Play";
    
}
function changeProgress(){
        audioplayer.currentTime = pgbar.value;
}
/* playBtn.addEventListener("click",startMusic);
pauseBtn.addEventListener("click",pauseMusic); */
audioplayer.addEventListener("timeupdate",currentTime);
toggle.addEventListener("click",toggleMusic);
audioplayer.addEventListener("ended",resetTime);
pgbar.addEventListener("input",changeProgress)
    </script>
</body>
</html>
